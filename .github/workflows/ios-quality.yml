name: iOS quality gates

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ios-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Run architecture, package, app, UI, performance, and coverage gates
        env:
          MINIMUM_APP_COVERAGE: "75"
        run: ./Scripts/run-quality-gates.sh
      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-coverage-summary
          path: .derived/quality-gates/coverage-summary.txt
          if-no-files-found: ignore
